services:
  fleet-db-primary:
    image: mysql:8.0
    container_name: fleet-primary
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin_password}
      MYSQL_DATABASE: fleet_db
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD:-replica_password}
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
    ports:
      - "3306:3306"
    volumes:
      - fleet_primary_data:/var/lib/mysql
      - ./infrastructure/primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  fleet-db-replica:
    image: mysql:8.0
    container_name: fleet-replica
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin_password}
      SOURCE_HOST: fleet-db-primary
      SOURCE_PORT: 3306
      SOURCE_USER: fleet_replicator
      SOURCE_PASSWORD: ${MYSQL_REPLICATION_PASSWORD:-replica_password}
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --read-only=ON
      - --super-read-only=ON
      - --replicate-wild-do-table=fleet_db.%
    ports:
      - "3307:3306"
    volumes:
      - fleet_replica_data:/var/lib/mysql
      - ./infrastructure/replica-init:/docker-entrypoint-initdb.d:ro
    depends_on:
      fleet-db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  fleet_primary_data:
  fleet_replica_data:
