server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    primary:
      jdbc-url: ${PRIMARY_DB_URL:jdbc:mysql://localhost:3306/fleet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      username: ${PRIMARY_DB_USER:root}
      password: ${PRIMARY_DB_PASSWORD:admin_password}
      driver-class-name: com.mysql.cj.jdbc.Driver
    replica:
      jdbc-url: ${REPLICA_DB_URL:jdbc:mysql://localhost:3307/fleet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      username: ${REPLICA_DB_USER:root}
      password: ${REPLICA_DB_PASSWORD:admin_password}
      driver-class-name: com.mysql.cj.jdbc.Driver
